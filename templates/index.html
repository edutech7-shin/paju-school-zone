<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{APP_TITLE}}</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">와석초등학교 업무효율화 연구학교</p>
        <h1>{{APP_TITLE}}</h1>
        <p class="lede">
          나이스 명렬표 기반 통학구역별 재학생 현황 조사 프로그램
        </p>
      </section>

      <section class="panel">
        <h2>학생 주소록 처리</h2>

        <form method="post" action="/process" enctype="multipart/form-data" class="stack">
          <label for="school_name">학교명</label>
          <input id="school_name" type="text" name="school_name" list="school-list" placeholder="예: 와석초" required>
          <datalist id="school-list">{{SCHOOL_OPTIONS}}</datalist>
          <p class="hint">
            학교명은 필수 입력이며, 기준일은 달력에서 선택할 수 있습니다.
          </p>
          <label for="base_date">기준일(선택)</label>
          <input id="base_date" type="date" name="base_date">

          <label for="files">학생 주소록 엑셀</label>
          <input id="files" type="file" name="files" accept=".xlsx" multiple>
          <p class="hint compact">
          <ol class="guide-list">
            <li>나이스 학생 명렬표에서 학년을 선택하세요.</li>
            <li>우편번호와 주소 항목을 추가한 후 조회한 후 엑셀 파일로 다운받으세요.</li>
            <li>여러 개의 파일을 한 번에 선택할 수 있습니다.</li>
          </ol>
          </p>
          <div id="selected-files" class="selected-files">선택된 파일 없음</div>

          <button type="submit" class="primary-submit">보고서 생성</button>
        </form>
      </section>

      {{ERROR}}
      {{RESULT}}
    </main>
    <script>
      const input = document.getElementById("files");
      const output = document.getElementById("selected-files");

      input.addEventListener("change", () => {
        const files = Array.from(input.files || []);
        if (!files.length) {
          output.textContent = "선택된 파일 없음";
          return;
        }
        output.innerHTML = files
          .map((file) => `<span>${file.name}</span>`)
          .join("");
      });
    </script>
  </body>
</html>
